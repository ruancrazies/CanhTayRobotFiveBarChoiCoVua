# Hardware constants for the five-bar chess robot.
#
# Source of truth: docs/SPEC.md section 4 (SPEC rule 7: no hard-coded hardware
# constants anywhere else on the PC side; the firmware mirrors the pin map in
# include/pins.h and include/config.h).
#
# Coordinate frame: origin O at the midpoint of the two motor axes, +Y toward
# the board. Motor #1 (angle alpha) is at (-l/2, 0); motor #2 (angle beta) is
# at (+l/2, 0). Rank 1 is nearest the robot, file A is on the left (x < 0).
#
# Values that are still [TO CONFIRM] are listed under `to_confirm` at the
# bottom. They carry the default stated in the SPEC and the loader logs a
# warning for each of them until the owner confirms the value.

geometry:
  motor_axis_distance_mm: 100.0   # l: distance between the two motor axes
  driving_link_mm: 200.0          # m
  driven_link_mm: 250.0           # n
  motor_to_board_edge_mm: 150.0   # k: motor axes to near edge of board (border included)
  square_size_mm: 31.0            # s
  board_border_mm: 26.0
  squares_per_side: 8
  z_travel_mm: 70.0               # h

drive:
  full_steps_per_rev: 200         # NEMA 17 style 1.8 degree stepper (the "200" in 200*f*i)
  microstepping: 16               # f: TB6600 microstepping
  gear_ratio: 1.0                 # i: motor to driving link  [TO CONFIRM], SPEC default 1

pins:                             # ESP32 GPIO numbers (D13 -> 13, ...)
  joint1:                         # TB6600 #1, joint 1 (alpha)
    ena: 13
    dir: 14
    pul: 27
  joint2:                         # TB6600 #2, joint 2 (beta)
    ena: 26
    dir: 25
    pul: 33
  z_motor:                        # Z DC motor through L298
    pwm: 4                        # L298 ENA, PWM about 10 kHz
    in1_raise: 18                 # L298 IN1 = raise direction
    in2_lower: 19                 # L298 IN2 = lower direction
  i2c:                            # ADS1115
    sda: 21
    scl: 22
  servo_pwm: 32                   # SG90 PWM
  limit_top: 35                   # limit switch #1 (TOP), input only, external pull-down
  limit_bottom: 34                # limit switch #2 (BOTTOM), input only, external pull-down

electrical:
  tb6600:
    wiring: common_anode          # (+) inputs to 3V3, (-) inputs to GPIOs; LOW GPIO = opto conducts
    microstep_dip:                # 16 microsteps: SW1 OFF, SW2 OFF, SW3 ON
      sw1_on: false
      sw2_on: false
      sw3_on: true
    ena_level_driver_enabled: HIGH    # GPIO HIGH or floating = driver enabled
    ena_level_driver_disabled: LOW    # GPIO LOW = driver disabled (DISABLE pulls LOW)
    low_active_enables_stepper: false # FastAccelStepper setEnablePin(pin, false)
    auto_enable: false                # FastAccelStepper setAutoEnable(false)

  limit_switches:
    contact: NC                   # normally closed: COM to 3V3, NC to the signal pin
    com_connected_to: 3V3
    external_pulldown_ohm: 10000
    idle_level: HIGH              # normally HIGH
    actuated_level: LOW           # actuated or wire broken = LOW (fail-safe)
    debounce_ms_min: 5            # firmware debounce window 5-10 ms
    debounce_ms_max: 10

  ads1115:
    address: 0x48                 # ADDR pin tied to GND
    addr_pin_tied_to: GND
    pga_full_scale_v: 4.096       # PGA +/-4.096 V

  as5600:
    output_mode: analog
    outs_register: 0              # default OUTS = 00, not programmed
    output_min_percent_vdd: 0.0   # full analog range 0-100 % of Vdd
    output_max_percent_vdd: 100.0
    joint1_alpha_adc_channel: 1   # ADS1115 A1 = AS5600 #1 (alpha)
    joint2_beta_adc_channel: 0    # ADS1115 A0 = AS5600 #2 (beta)
    vdd_adc_channel: 2            # ADS1115 A2 = Vdd reference, r = V_OUT / V_A2
    r_fault_low: 0.02             # r < 0.02 -> !alarm:SENSOR_FAULT
    r_fault_high: 0.98            # r > 0.98 -> !alarm:SENSOR_FAULT
    system_error_deg: 1.0         # about +/-1 degree: lost-step detection and homing only
    calibration_file: data/calibration/encoder_calibration.json   # per-sensor k and b

  z_axis:
    driver: L298
    pwm_frequency_hz: 10000       # about 10 kHz
    timeout_factor: 1.5           # per-move timeout = 1.5 x full-travel time

  servo:
    model: SG90
    pwm_frequency_hz: 50
    pulse_us_at_0_deg: 500        # 500-2500 us for 0-180 degrees
    pulse_us_at_180_deg: 2500
    separate_5v_supply: true
    common_gnd_with_esp32: true
    separate_ledc_channel_and_timer: true   # must not collide with the Z motor PWM

# Dotted paths of values above that are still [TO CONFIRM]. Ask the owner, then
# remove the entry once the value is confirmed.
to_confirm:
  - drive.gear_ratio
