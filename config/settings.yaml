# The ONE place every changeable value of the chess robot lives (docs/SPEC.md rule 7, sections 3 and 4).
#
# A value is changeable when changing it changes behaviour, timing, geometry, limits, wiring, thresholds, sizes or
# paths. Only protocol words, FSM transition rules, Vietnamese UI strings, mathematical or physical constants and
# the PlatformIO package pins stay in code.
#
# Who reads this file:
#   * the PC side, through the typed loader desktop_app/utils/settings.py (unknown keys and wrong types are rejected);
#   * the firmware, through firmware/include/pins.h and firmware/include/config.h, which are GENERATED from it:
#         python -m tools.gen_all          (after every edit of this file; a test fails when they are stale)
#   * docs/CONFIG_REFERENCE.md, also generated by the command above.
#
# Rules for this file:
#   * every value has a comment on its own line saying what it is (a test enforces it);
#   * a unit goes in the key name (_mm, _ms, _us, _s, _hz, _deg, _deg_s, _deg_s2, _v, _ohm, _bytes, _bits);
#   * null means "no value yet" or "feature off", as each comment says; the PC code refuses to run the feature that
#     needs a null value, and the firmware header carries 0 for it;
#   * per-machine values (Stockfish path, serial port) go in config/local.yaml, never here
#     (copy config/local.example.yaml; the STOCKFISH_PATH environment variable beats both files).
#
# Coordinate frame: origin O at the midpoint of the two motor axes, +Y toward the board. Motor #1 (angle alpha) is
# at (-l/2, 0); motor #2 (angle beta) is at (+l/2, 0). Rank 1 is nearest the robot, file A is on the left (x < 0).

# Dotted key paths of every value that is NOT yet confirmed on the real hardware. The owner replaces the value and
# deletes its entry here once it is measured or decided. A null value is listed here too (it has no value at all).
# Every entry must exist in this file (a test enforces it). The planner and the Robot Commander treat the grasp
# angles, the reserve contents and the capture/reserve/park layout as placeholders while they are listed here.
assumed:
  - serial.baud
  - serial.queue_depth
  - timeouts.heartbeat_timeout_ms
  - electrical.limit_switches.debounce_ms
  - electrical.tb6600.joint1_dir_high_counts_up
  - electrical.tb6600.joint2_dir_high_counts_up
  - electrical.z_axis.full_travel_ms
  - electrical.z_axis.ledc_channel
  - electrical.z_axis.pwm_resolution_bits
  - electrical.z_axis.duty_start_percent
  - electrical.z_axis.duty_peak_percent
  - electrical.z_axis.duty_ramp_ms
  - electrical.z_axis.duty_eased_percent
  - electrical.z_axis.ease_after_travel_percent
  - electrical.servo.ledc_channel
  - electrical.servo.pwm_resolution_bits
  - motion.max_speed_deg_s
  - motion.max_accel_deg_s2
  - motion.direction_change_delay_us
  - motion.step_loss_threshold_deg
  - motion.joint_limits.alpha_min_deg
  - motion.joint_limits.alpha_max_deg
  - motion.joint_limits.beta_min_deg
  - motion.joint_limits.beta_max_deg
  - commander.move_speed_deg_s
  - commander.acceleration_deg_s2
  - commander.ping_interval_ms
  - commander.grip_settle_ms
  - commander.start_tolerance_deg
  - commander.reply_timeout_ms
  - commander.done_timeout_ms
  - commander.send_timeout_ms
  - commander.queue_retry_ms
  - commander.queue_full_timeout_ms
  - link.write_timeout_ms
  - grasp.open_deg
  - grasp.close_deg.P
  - grasp.close_deg.N
  - grasp.close_deg.B
  - grasp.close_deg.R
  - grasp.close_deg.Q
  - grasp.close_deg.K
  - layout.capture_slots.x_mm
  - layout.capture_slots.y_mm
  - layout.reserve_slots.x_mm
  - layout.reserve_slots.y_mm
  - layout.park.x_mm
  - layout.park.y_mm
  - layout.reserve_pieces

# ---- Geometry and drive (SPEC 4.1) -------------------------------------------------------------------------------
geometry:
  # l: distance between the two motor axes
  motor_axis_distance_mm: 100.0
  # m: driving link length
  driving_link_mm: 200.0
  # n: driven link length
  driven_link_mm: 250.0
  # k: motor axes to the near edge of the board (border included)
  motor_to_board_edge_mm: 150.0
  # s: size of one square
  square_size_mm: 31.0
  # width of the board border around the 8 x 8 squares
  board_border_mm: 26.0
  # number of squares along one side of the board
  squares_per_side: 8
  # h: Z travel between TOP and BOTTOM
  z_travel_mm: 70.0

drive:
  # NEMA 17 style 1.8 degree stepper: the "200" in 200 * f * i
  full_steps_per_rev: 200
  # f: TB6600 microstepping (SW1 OFF, SW2 OFF, SW3 ON)
  microstepping: 16
  # i: gear ratio motor to driving link; confirmed 1:1 direct drive
  gear_ratio: 1.0

# ---- ESP32 pin map (SPEC 4.2); GPIO numbers (D13 -> 13) -------------------------------------------------------------
pins:
  joint1:
    # TB6600 #1 ENA- (joint 1, alpha)
    ena: 13
    # TB6600 #1 DIR-
    dir: 14
    # TB6600 #1 PUL-
    pul: 27
  joint2:
    # TB6600 #2 ENA- (joint 2, beta)
    ena: 26
    # TB6600 #2 DIR-
    dir: 25
    # TB6600 #2 PUL-
    pul: 33
  z_motor:
    # L298 ENA: Z motor PWM
    pwm: 4
    # L298 IN1: raise direction
    in1_raise: 18
    # L298 IN2: lower direction
    in2_lower: 19
  i2c:
    # ADS1115 SDA
    sda: 21
    # ADS1115 SCL
    scl: 22
  # SG90 gripper servo PWM
  servo_pwm: 32
  # limit switch #1 (TOP): input only, external pull-down
  limit_top: 35
  # limit switch #2 (BOTTOM): input only, external pull-down
  limit_bottom: 34

# ---- Electrical conventions (SPEC 4.3) ---------------------------------------------------------------------------
electrical:
  tb6600:
    # (+) inputs to 3V3, (-) inputs to GPIOs; a LOW GPIO makes the opto conduct. Only common_anode is supported
    wiring: common_anode
    microstep_dip:
      # microstep DIP SW1 (16 microsteps: SW1 OFF)
      sw1_on: false
      # microstep DIP SW2 (16 microsteps: SW2 OFF)
      sw2_on: false
      # microstep DIP SW3 (16 microsteps: SW3 ON)
      sw3_on: true
    # ENA GPIO level that leaves the driver enabled (HIGH or floating)
    ena_level_driver_enabled: HIGH
    # ENA GPIO level that disables the driver (DISABLE pulls the GPIO to it)
    ena_level_driver_disabled: LOW
    # Documents the ENA polarity (false: HIGH = driver enabled). The firmware drives the ENA pins itself and does not
    # call FastAccelStepper setEnablePin() (it would disable the driver at boot), so nothing reads this key yet.
    low_active_enables_stepper: false
    # FastAccelStepper setAutoEnable(auto_enable)
    auto_enable: false
    # joint 1 (alpha): true = DIR GPIO HIGH makes the step count (and the angle) go up; wrong polarity turns the joint the wrong way
    joint1_dir_high_counts_up: true
    # joint 2 (beta): true = DIR GPIO HIGH makes the step count (and the angle) go up
    joint2_dir_high_counts_up: true
  limit_switches:
    # normally closed contact: COM to 3V3, NC to the signal pin (a broken wire reads as actuated)
    contact: NC
    # what the COM terminal is wired to
    com_connected_to: 3V3
    # external pull-down resistor on D34 / D35
    external_pulldown_ohm: 10000
    # signal level when the switch is not actuated
    idle_level: HIGH
    # signal level when the switch is actuated or the wire is broken
    actuated_level: LOW
    # lowest debounce window the SPEC allows
    debounce_min_ms: 5
    # highest debounce window the SPEC allows
    debounce_max_ms: 10
    # debounce window the firmware uses (SPEC 4.3: 5 to 10 ms)
    debounce_ms: 8
  ads1115:
    # I2C address (ADDR pin tied to GND = 0x48)
    address: 0x48
    # what the ADDR pin is wired to
    addr_pin_tied_to: GND
    # PGA full scale (+/- this voltage)
    pga_full_scale_v: 4.096
  as5600:
    # analog output mode
    output_mode: analog
    # OUTS register value (default 00, not programmed)
    outs_register: 0
    # lowest analog output, in percent of Vdd
    output_min_percent_vdd: 0.0
    # highest analog output, in percent of Vdd
    output_max_percent_vdd: 100.0
    # ADS1115 channel of AS5600 #1 (alpha): A1
    joint1_alpha_adc_channel: 1
    # ADS1115 channel of AS5600 #2 (beta): A0
    joint2_beta_adc_channel: 0
    # ADS1115 channel of the Vdd reference: A2 (r = V_OUT / V_A2)
    vdd_adc_channel: 2
    # r below this value raises !alarm:SENSOR_FAULT
    r_fault_low: 0.02
    # r above this value raises !alarm:SENSOR_FAULT
    r_fault_high: 0.98
    # sensor system error, about +/- this angle: used only for lost-step detection and homing
    system_error_deg: 1.0
    # per-sensor k and b of theta = k * r * 360 + b
    calibration_file: data/calibration/encoder_calibration.json
  z_axis:
    # Z motor driver
    driver: L298
    # Z motor PWM frequency (about 10 kHz)
    pwm_frequency_hz: 10000
    # per-move Z timeout = this factor x the full-travel time
    timeout_factor: 1.5
    # full Z travel time TOP <-> BOTTOM, measured at assembly (SPEC 13); null = not measured yet
    full_travel_ms: 5000
    # PWM resolution of the Z motor LEDC channel
    pwm_resolution_bits: 8
    # LEDC channel of the Z motor PWM (must use a different timer than the servo: channel c uses timer (c / 2) % 4)
    ledc_channel: 0
    # Z motor duty at the start of a move, in percent of full PWM; the duty ramps from here to duty_peak_percent
    duty_start_percent: 40
    # Z motor duty at the end of the ramp, in percent of full PWM
    duty_peak_percent: 70
    # time the duty takes to ramp from duty_start_percent to duty_peak_percent
    duty_ramp_ms: 500
    # Z motor duty near the end of the travel (eased, so the carriage meets the limit switch gently), in percent
    duty_eased_percent: 40
    # the duty drops to duty_eased_percent once a move has run this share of full_travel_ms, in percent
    ease_after_travel_percent: 80
    # level of the three L298 pins (ENA, IN1, IN2) at boot, so Z cannot move before a command (SPEC 10.2); only LOW
    motor_pins_boot_level: LOW
  servo:
    # gripper servo model
    model: SG90
    # servo PWM frequency
    pwm_frequency_hz: 50
    # pulse width at 0 degrees
    pulse_at_0_deg_us: 500
    # pulse width at 180 degrees
    pulse_at_180_deg_us: 2500
    # PWM resolution of the servo LEDC channel
    pwm_resolution_bits: 16
    # LEDC channel of the servo PWM (must use a different timer than the Z motor)
    ledc_channel: 2
    # the servo has its own 5 V supply
    separate_5v_supply: true
    # the servo GND is common with the ESP32 GND
    common_gnd_with_esp32: true
    # the servo uses its own LEDC channel and timer, not the Z motor's
    separate_ledc_channel_and_timer: true

# ---- Serial link, queue and buffer sizes (SPEC 5) -----------------------------------------------------------------
serial:
  # serial baud rate (SPEC 5: suggested 115200); platformio.ini monitor_speed must equal it (a test checks)
  baud: 115200
  # serial port of the ESP32 (for example COM3 or /dev/ttyUSB0); per-machine, so set it in config/local.yaml; null = none chosen
  port: null
  # ESP32 UART receive buffer: room for a few full lines
  rx_buffer_bytes: 512
  # longest accepted line, terminator excluded; the PC framer and the firmware use the same limit
  max_line_bytes: 256
  # longest line the firmware sends, terminator excluded
  max_response_bytes: 128
  # depth of the firmware motion queue (SPEC 5.3: "once the real queue depth is known")
  queue_depth: 8

timeouts:
  # PING gap after which the ESP32 stops safely (SPEC 5.3, 10.2); must stay well above the PC ping interval
  heartbeat_timeout_ms: 2000
  # how long stop() waits for a worker thread (serial reader, heartbeat, simulator)
  thread_join_ms: 3000

# ---- Motion limits and trajectory (SPEC 6 and 10.2) ----------------------------------------------------------------
motion:
  # maximum joint speed (SPEC 13); a MOVE with a larger F is error:2; null = not decided (every MOVE is then error:2)
  max_speed_deg_s: 30.0
  # maximum joint acceleration (SPEC 13); an ACCEL with a larger S is error:2; it is also the acceleration used before the
  # first ACCEL; null = not decided (every MOVE and ACCEL is then error:2)
  max_accel_deg_s2: 60.0
  # delay after a direction change, because the TB6600 DIR opto is slow (SPEC 10.2); null = not decided
  direction_change_delay_us: 20
  # lost-step threshold, "start at 3 degrees" (SPEC 13)
  step_loss_threshold_deg: 3.0
  # longest segment of a straight-line trajectory (SPEC 6.3: default 2 mm)
  trajectory_step_mm: 2.0
  # smallest singularity margin mu allowed at every pick point and trajectory point (SPEC 6.2)
  singularity_margin_deg: 15.0
  joint_limits:
    # soft limit of joint alpha, low end; null = not known (all four limits are set together or not at all)
    alpha_min_deg: 60.0
    # soft limit of joint alpha, high end
    alpha_max_deg: 200.0
    # soft limit of joint beta, low end
    beta_min_deg: -20.0
    # soft limit of joint beta, high end
    beta_max_deg: 115.0
  # BENCH ONLY. true lets MOVE run without homing (only the homed part of check 4 of SPEC 5.2 is skipped; the Z-at-TOP part applies from stage 4b-2).
  # Use it to turn a joint by hand-sized steps before homing exists. false (the default) is the SPEC behaviour.
  bench_move_without_homing: false

# ---- Firmware identity ---------------------------------------------------------------------------------------------
firmware:
  # FW= of the INFO reply: one token, no spaces, no '='
  version: "4b1-s1"

# ---- PC side: Robot Commander (SPEC 5.3, 6.4); null = no value yet, the Commander then refuses to be built ---------
commander:
  # F of every MOVE
  move_speed_deg_s: 20.0
  # ACCEL S= sent before each chain; null = no ACCEL is sent
  acceleration_deg_s2: 40.0
  # PING interval (well below timeouts.heartbeat_timeout_ms)
  ping_interval_ms: 500
  # the servo gives no feedback: wait this long after a GRIP
  grip_settle_ms: 400
  # how far the arm may be from the first point of a chain (the AS5600 is about +/- 1 degree)
  start_tolerance_deg: null
  # how long an ok may take
  reply_timeout_ms: null
  # how long a done may take (HOME, ZUP, ZDOWN, WAIT): above the Z timeout
  done_timeout_ms: null
  # how long a send may wait for a free in-flight slot
  send_timeout_ms: null
  # pause before a MOVE refused with error:3 (queue full) is sent again
  queue_retry_ms: null
  # give up (and stop the chain) when the queue stays full this long
  queue_full_timeout_ms: null
  # waits wake this often to re-read the clock, so an injected clock can end them
  clock_poll_ms: 50

# ---- PC side: serial link -----------------------------------------------------------------------------------------------
link:
  # unacknowledged commands in flight (SPEC 5.3: only a few); must not exceed serial.queue_depth
  max_in_flight: 3
  # how often the reader thread looks at the stop flag
  read_poll_ms: 50
  # write timeout of the real serial port; null = not decided
  write_timeout_ms: null
  # pause between reconnect attempts; null = the link does not reconnect
  reconnect_interval_ms: null
  # reconnect attempts before giving up; null = retry forever (only used when reconnect_interval_ms is set)
  reconnect_max_attempts: null
  # how many bytes of an over-long line are kept for the log
  raw_preview_bytes: 24

# ---- ESP32 simulator ------------------------------------------------------------------------------------------------------
simulator:
  # FW= the simulator answers to INFO: one token
  firmware_version: sim
  # how often the serving thread wakes to run its timers
  poll_ms: 2
  # time the simulated joint homing takes; null = not decided (a SimConfig needs it)
  home_joints_ms: null
  # simulated power-up angle of joint alpha; null = not decided
  initial_alpha_deg: null
  # simulated power-up angle of joint beta; null = not decided
  initial_beta_deg: null
  # simulated Z position at power-up: TOP or BOTTOM
  initial_z: TOP

# ---- Chess engine and the five difficulty modes (SPEC 9) ----------------------------------------------------------------
engine:
  # Stockfish executable (a per-machine path belongs in config/local.yaml or STOCKFISH_PATH)
  path: stockfish
  # extra time allowed on top of the think time before the engine counts as not answering
  answer_margin_ms: 5000
  # engine restarts before giving up
  max_restarts: 1
  # mode used when none is chosen (beginner, amateur, player, master or grandmaster)
  default_mode: amateur
  # UCI options applied before the options of a mode
  default_options: {UCI_LimitStrength: false, "Skill Level": 20}
  modes:
    beginner:
      # UCI options of this mode
      options: {"Skill Level": 0}
      # think time per move
      think_time_ms: 200
      # search depth limit (null = no limit)
      max_depth: 2
    amateur:
      # UCI options of this mode
      options: {UCI_LimitStrength: true, UCI_Elo: 1400}
      # think time per move
      think_time_ms: 500
      # search depth limit (null = no limit)
      max_depth: null
    player:
      # UCI options of this mode
      options: {UCI_LimitStrength: true, UCI_Elo: 1800}
      # think time per move
      think_time_ms: 1000
      # search depth limit (null = no limit)
      max_depth: null
    master:
      # UCI options of this mode
      options: {UCI_LimitStrength: true, UCI_Elo: 2400}
      # think time per move
      think_time_ms: 2000
      # search depth limit (null = no limit)
      max_depth: null
    grandmaster:
      # UCI options of this mode (none: full strength)
      options: {}
      # think time per move
      think_time_ms: 3000
      # search depth limit (null = no limit)
      max_depth: null

# ---- Gripper grasp angles (SPEC 6.4); all of them are still assumed ----------------------------------------------------
grasp:
  # servo angle with the gripper open
  open_deg: 90
  close_deg:
    # servo angle with the gripper closed on a pawn
    P: 60
    # servo angle with the gripper closed on a knight
    N: 60
    # servo angle with the gripper closed on a bishop
    B: 60
    # servo angle with the gripper closed on a rook
    R: 60
    # servo angle with the gripper closed on a queen
    Q: 60
    # servo angle with the gripper closed on a king
    K: 60

# ---- Capture / reserve / park layout (SPEC 6.4); the owner's proposal, still assumed -----------------------------------
layout:
  capture_slots:
    # x of the capture slot columns; slots are x-major: every y of the first x, then the next x (15 slots)
    x_mm: [-190.0, -225.0, -260.0]
    # y of the capture slot rows
    y_mm: [160.0, 195.0, 230.0, 265.0, 300.0]
  reserve_slots:
    # x of the reserve slot columns, x-major (4 slots)
    x_mm: [190.0, 225.0]
    # y of the reserve slot rows
    y_mm: [200.0, 235.0]
  park:
    # x of the park position, outside the camera view
    x_mm: 0.0
    # y of the park position, outside the camera view
    y_mm: 120.0
  # spare piece of each reserve slot, in slot order (Q, R, B or N)
  reserve_pieces: [Q, R, B, N]

# ---- Paths (relative to the repository root) ------------------------------------------------------------------------------------
paths:
  # folder of the saved game (FEN, PGN and the pending move)
  games_dir: data/games
  # current position, saved after every commit
  fen_file: current.fen
  # current game as PGN
  pgn_file: current.pgn
  # the engine move that is not committed yet
  pending_file: pending.json

# ---- Application log ----------------------------------------------------------------------------------------------------------------
logging:
  # size at which the rotating log file is renewed
  max_bytes: 1000000
  # rotated log files kept
  backup_count: 3
