; Chess robot firmware (docs/SPEC.md section 10). Stage 4a: skeleton + hardware-independent core.
;
; EVERY version is pinned (no ^, ~, * or bare names). Status of each pin (see firmware/BRINGUP.md):
;   platformio Core 6.2.0          VERIFIED: installs from PyPI and runs (`pip install platformio==6.2.0`)
;   espressif32 platform 6.9.0     NOT VERIFIED (the registry was unreachable when this was written)
;   framework-arduinoespressif32   NOT VERIFIED (3.20017.241212 should be Arduino-ESP32 2.0.17)
;   native platform 1.2.1          NOT VERIFIED
;   Unity 2.6.1                    PARTLY: PlatformIO Core 6.2.0 asks for "^2.6.1"; 2.6.1 is the floor of that range
; Stage 4a uses no external library on the device, so there is no FastAccelStepper / ADS1115 / servo
; entry yet. Stage 4b adds each library here with an exact version in the same commit that uses it.
;
; The monitor baud below MUST equal kBaudRate in include/config.h (tests/test_firmware_layout.py checks it).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
platform_packages =
    platformio/framework-arduinoespressif32 @ 3.20017.241212
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
; Host-side unit tests of lib/chessbot_core: `pio test -e native` (see BRINGUP.md).
; Only the hardware-independent core is built here; src/main.cpp is not.

[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps =
    throwtheswitch/Unity@2.6.1
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
